<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jet Laggueur</title>
  <!-- ASSET_VERSION: bump ?v= on every release (GitHub Pages caches files 10 min, a mix of old and new scripts breaks the app). -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/theme.css?v=7">
  <link rel="stylesheet" href="css/header.css?v=7">
  <link rel="stylesheet" href="css/layout.css?v=7">
  <link rel="stylesheet" href="css/buttons.css?v=7">
  <link rel="stylesheet" href="css/modal.css?v=7">
  <link rel="stylesheet" href="css/forms.css?v=7">
  <link rel="stylesheet" href="css/flights.css?v=7">
  <link rel="stylesheet" href="css/map.css?v=7">
  <link rel="stylesheet" href="css/calendar.css?v=7">
  <link rel="stylesheet" href="css/detail.css?v=7">
  <link rel="stylesheet" href="css/readonly.css?v=7">
  <link rel="stylesheet" href="css/responsive.css?v=7">
  <link rel="stylesheet" href="css/home.css?v=7">
</head>
<body class="view-home">

<header class="app-header">
  <div class="logo"><img src="icon.png" alt="" class="logo-icon"> <span>Jet</span>Laggueur</div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm header-trip-only home-btn" onclick="openHome()" title="Retour à l'accueil" aria-label="Retour à l'accueil"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg><span class="btn-label">Voyages</span></button>
    <input type="text" id="trip-title-input" class="header-trip-only" placeholder="Nom du voyage…" value="Mon Voyage">
    <button id="mode-btn" class="btn btn-ghost btn-sm header-trip-only mode-btn" hidden onclick="toggleEditMode()"></button>
    <button id="cloud-pill" class="cloud-pill header-trip-only" hidden onclick="openCloudShare(currentTripId)"></button>
    <select id="theme-select" class="theme-select header-home-only" onchange="setTheme(this.value)" title="Thème"></select>
  </div>
</header>

<section id="home-screen">
  <div class="home-container">
    <div class="home-header">
      <h1>Mes voyages</h1>
      <div class="home-actions">
        <button class="btn btn-gold" onclick="createTrip()">+ Nouveau voyage</button>
        <button class="btn btn-ghost" onclick="openImport()">↙ Importer</button>
        <button class="btn btn-ghost" onclick="openSync()" title="Synchroniser">☁ Sync</button>
      </div>
    </div>
    <div id="home-trip-list" class="home-trip-list"></div>
  </div>
</section>

<div class="map-panel">
  <div id="map"></div>
</div>

<div class="main-content">
  <button class="island-handle" onclick="toggleIsland()" aria-label="Réduire / Agrandir le panneau"><span class="island-grip"></span></button>
  <section class="timeline-section" aria-label="Programme du voyage">
    <div id="timeline"></div>
  </section>
  <details class="section section-collapsible" id="tab-jours" open>
    <summary class="section-header">
      <div class="icon">📅</div>
      <h2>Calendrier du voyage</h2>
      <span class="section-chevron">▾</span>
    </summary>
    <div class="section-body">
        <div class="calendar-meta">
          <div id="cal-meta-info"></div>
          <label class="toggle-travel">
            <input type="checkbox" id="toggle-travel" onchange="toggleTravel(this.checked)" checked>
            Trajets
          </label>
          <label class="toggle-travel">
            <input type="checkbox" id="toggle-activities" onchange="toggleActivities(this.checked)" checked>
            Activités
          </label>
          <label class="toggle-travel">
            <input type="checkbox" id="toggle-nights" onchange="toggleNights(this.checked)" checked>
            Nuits
          </label>
          <div class="cal-zoom" role="group" aria-label="Zoom horizontal de la timeline">
            <span class="cal-zoom-axis" aria-hidden="true">⇔</span>
            <button class="cal-zoom-btn" onclick="changeCalZoom(-1)" title="Dézoomer (horizontal)" aria-label="Dézoomer horizontal">−</button>
            <input type="range" id="cal-zoom-range" class="cal-zoom-range" min="40" max="320" step="10" value="220" oninput="setCalZoom(Number(this.value))" title="Largeur d'un jour">
            <button class="cal-zoom-btn" onclick="changeCalZoom(1)" title="Zoomer (horizontal)" aria-label="Zoomer horizontal">+</button>
            <button class="cal-zoom-btn cal-zoom-fit" onclick="fitCalZoom()" title="Afficher tout le voyage" aria-label="Tout afficher">↔</button>
          </div>
          <div class="cal-zoom" role="group" aria-label="Zoom vertical de la timeline">
            <span class="cal-zoom-axis" aria-hidden="true">⇕</span>
            <button class="cal-zoom-btn" onclick="changeCalVZoom(-1)" title="Dézoomer (vertical)" aria-label="Dézoomer vertical">−</button>
            <input type="range" id="cal-vzoom-range" class="cal-zoom-range" min="20" max="140" step="5" value="60" oninput="setCalVZoom(Number(this.value))" title="Hauteur d'une heure">
            <button class="cal-zoom-btn" onclick="changeCalVZoom(1)" title="Zoomer (vertical)" aria-label="Zoomer vertical">+</button>
            <button class="cal-zoom-btn cal-zoom-fit" onclick="fitCalVZoom()" title="Adapter à la hauteur" aria-label="Adapter la hauteur">↕</button>
          </div>
        </div>
        <div class="calendar-wrapper">
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </div>
  </details>

  <details class="section section-collapsible" id="flights-section">
    <summary class="section-header">
      <div class="icon">✈</div>
      <h2>Vols</h2>
      <span class="section-chevron">▾</span>
    </summary>
    <div class="section-body">
      <div id="flights-list"></div>
      <div id="no-flights" style="color:var(--muted);font-size:0.84rem;text-align:center;padding:20px 0;">Aucun vol ajouté.</div>
    </div>
  </details>

  <details class="section section-collapsible" id="trips-section">
    <summary class="section-header">
      <div class="icon">🗺</div>
      <h2>Déplacements</h2>
      <span class="section-chevron">▾</span>
    </summary>
    <div class="section-body">
      <div class="map-info" id="map-info">🗺️ Ajoutez des lieux pour voir l'itinéraire</div>
    </div>
  </details>
</div>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal-title">Titre</h3>
      <button class="detail-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<aside id="detail-panel" class="detail-panel">
  <div class="detail-panel-header">
    <h3 id="detail-title">Détails</h3>
    <button class="detail-close" onclick="closeDetail()">✕</button>
  </div>
  <div class="detail-panel-body" id="detail-body"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data/airports.js?v=7"></script>
<script src="js/data/timezones.js?v=7"></script>
<script src="js/util.js?v=7"></script>
<script src="js/state.js?v=7"></script>
<script src="js/prefs.js?v=7"></script>
<script src="js/map.js?v=7"></script>
<script src="js/weather.js?v=7"></script>
<script src="js/sun.js?v=7"></script>
<script src="js/flights.js?v=7"></script>
<script src="js/calendar.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
<script src="js/sync.js?v=7"></script>
<script src="js/cloud.js?v=7"></script>
<script src="js/visitor.js?v=7"></script>
<script src="js/readonly.js?v=7"></script>
<script src="js/timeline.js?v=7"></script>
<script src="js/init.js?v=7"></script>
</body>
</html>
